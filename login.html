<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코카콜라 로그인 페이지</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="로그인 | 코카콜라 - Pure Joy">
    <meta property="og:description" content="로그인 UI를 구현한 Login 페이지입니다.">
    <meta property="og:url" content="https://tkdcjdyd8382.dothome.co.kr/login.html">
    <meta property="og:image" content="https://tkdcjdyd8382.dothome.co.kr/images/og_login.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="로그인 | 코카콜라 - Pure Joy">
    <meta name="twitter:description" content="로그인 UI를 구현한 Login 페이지입니다.">
    <meta name="twitter:image" content="https://tkdcjdyd8382.dothome.co.kr/images/og_login.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon_index.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon_index.png">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css"
  >
    <style>
      body,
      h1,
      h2,
      h3,
      p,
      div,
      ul,
      li,
      dl,
      dt,
      dd {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "SUIT", "나눔고딕", sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }
      ul,
      li {
        list-style: none;
      }
      a {
        text-decoration: none;
        color: #000;
      }
      address {
        font-style: normal;
      }
      img {
        display: block;
      }
      .hide {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .menu_btn {
        display: none;
      }
      .icon_tab {
        display: none;
      }
      html,
      body {
        background-color: #1a1a1a;
        overflow-x: hidden;
      }
      fieldset {
        border: none;
        padding: 0;
        margin: 0;
      }
      .header {
        display: none;
      }
      .main {
        padding-top: 0;
      }
      .footer {
        display: none;
      }
      .main::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: radial-gradient(
          70% 55% at 50% 35%,
          rgba(0, 0, 0, 0.15) 0%,
          rgba(0, 0, 0, 0.55) 70%,
          rgba(0, 0, 0, 0.72) 100%
        );
      }
      .main {
        min-height: 100vh;
        position: relative;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 140px;
        box-sizing: border-box;
      }
      .login_form .logo {
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .logo_link {
        margin: 0 auto;
      }
      .login_bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        z-index: 0;
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .login_form {
        position: relative;
        z-index: 1;
        width: min(760px, 86vw);
        padding: 36px 24px 40px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        animation: popIn 0.6s ease both;
        animation-delay: 0.05s;
        background: rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        border-radius: 22px;
      }
      .login_form fieldset {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .login_form .logo {
        width: 100%;
        text-align: center;
        margin: 0 0 26px;
      }
      .login_form .logo_link {
        display: inline-block;
        position: relative;
        width: clamp(160px, 22vw, 300px);
        aspect-ratio: 300 / 95;
      }
      .login_form .logo_link img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .logo_default {
        opacity: 1;
        transition: opacity 0.15s ease;
      }
      .logo_hover {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      .logo_link:hover .logo_default,
      .logo_link:focus-visible .logo_default {
        opacity: 0;
      }
      .logo_link:hover .logo_hover,
      .logo_link:focus-visible .logo_hover {
        opacity: 1;
      }
      .logo_link:active {
        transform: scale(0.97);
      }
      .logo {
        height: auto;
      }
      .input_group {
        width: min(520px, 90vw);
        height: 72px;
        margin: 0 auto 1%;
        background-repeat: no-repeat;
        background-size: contain;
        background-position: center;
        display: flex;
        align-items: center;
      }
      .id_input {
        background-image: url("images/login_input_bg.png");
      }
      .pw_input {
        background-image: url("images/login_input_bg.png");
      }
      .save_id {
        width: min(520px, 90vw);
        margin: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        color: #fff8f2;
        font-size: 14px;
      }
      .save_id input {
        width: 18px;
        height: 18px;
        accent-color: #f40009;
        flex: 0 0 auto;
      }
      .save_id p {
        font-size: 14px;
        line-height: 1.4;
        color: rgba(255, 248, 242, 0.86);
      }
      .input_group input {
        height: 100%;
        width: 100%;
        padding: 2px 26px 0;
        background: transparent;
        border: 0;
        outline: 0;
        font-size: 16px;
        font-family: inherit;
        color: #fff8f2;
        line-height: 1;
      }
      .input_group input::placeholder {
        color: rgba(255, 248, 242, 0.7);
      }
      .login_action {
        width: min(520px, 90vw);
        margin: 10px auto 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .login_btn {
        width: clamp(320px, 60vw, 420px);
        height: 72px;
        background: url("images/btn_login.png") no-repeat center / contain;
        border: none;
        cursor: pointer;
        text-indent: 0;
        color: #e6e6e6;
        font-size: 14px;
        font-weight: 800;
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        overflow: hidden;
      }
      .login_btn {
        transition:
          transform 0.12s ease,
          filter 0.12s ease;
      }
      .login_btn:hover {
        transform: translateY(-1px);
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35));
      }
      .login_btn:active {
        transform: translateY(0) scale(0.97);
      }
      .login_links {
        width: min(520px, 90vw);
        margin: 18px auto 0;
        text-align: center;
      }
      .login_links a {
        display: block;
        font-size: 13px;
        color: #e6e6e6;
      }
      .login_links a:hover {
        color: #fff8f2;
      }
      @media (max-width: 1194px) {
        .icon_pc {
          display: none;
        }
        .icon_tab {
          display: block;
        }
      }
      @media (max-width: 762px) {
        .main_image {
          height: 55vh;
          min-height: 520px;
          overflow: hidden;
        }
        .main_image img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        .logo img {
          width: clamp(96px, 22vw, 120px);
          height: auto;
        }
      }
      @media (max-width: 560px) {
        .input_group input {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main id="main" class="main">
      <img
        src="images/login_bg.png"
        alt="로그인 바탕 화면"
        class="login_bg"
    >
      <form class="login_form" action="#" method="post">
        <fieldset>
          <legend class="hide">로그인</legend>
          <h1 class="logo">
            <a href="index.html" class="logo_link">
              <img
                src="images/cocacola_login_logo.png"
                alt="코카콜라 로그인 로고"
                class="logo_default"
            >
              <img
                src="images/cocacola_login_logo_hover.png"
                alt=""
                class="logo_hover"
                aria-hidden="true"
            >
            </a>
          </h1>
          <div class="input_group id_input">
            <label class="hide" for="login_id">아이디</label>
            <input
              type="text"
              id="login_id"
              name="id"
              placeholder="ID"
              autocomplete="username"
              required
          >
          </div>
          <div class="input_group pw_input">
            <label class="hide" for="login_pw">비밀번호</label>
            <input
              type="password"
              id="login_pw"
              name="pw"
              placeholder="PW"
              autocomplete="current-password"
              required
          >
          </div>
          <div class="login_action">
            <label class="save_id">
              <input type="checkbox" name="save_id" value="Y">
              <span>아이디 저장</span>
            </label>
            <button
              type="submit"
              class="login_btn"
              id="loginBtn"
              aria-label="로그인"
            >
              로그인
            </button>
          </div>
          <div class="login_links">
            <a href="#" onclick="return false;">비밀번호를 잊으셨나요?</a><br>
            <a href="join.html">회원가입</a>
          </div>
        </fieldset>
      </form>
    </main>
    <script>
      const loginBtn = document.getElementById("loginBtn");
      if (loginBtn) {
        loginBtn.addEventListener("mouseenter", () => {
          loginBtn.style.backgroundImage =
            'url("images/btn_login_hover.png")';
        });
        loginBtn.addEventListener("mouseleave", () => {
          loginBtn.style.backgroundImage = 'url("images/btn_login.png")';
        });
      }
    </script>
  </body>
</html>
