<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코카콜라 문의하기</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="문의하기 | 코카콜라 - Pure Joy">
    <meta property="og:description" content="포트폴리오 관련 문의를 남길 수 있는 Contact 페이지입니다.">
    <meta property="og:url" content="https://tkdcjdyd8382.dothome.co.kr/contact.html">
    <meta property="og:image" content="https://tkdcjdyd8382.dothome.co.kr/images/og_contact.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="문의하기 | 코카콜라 - Pure Joy">
    <meta name="twitter:description" content="포트폴리오 관련 문의를 남길 수 있는 Contact 페이지입니다.">
    <meta name="twitter:image" content="https://tkdcjdyd8382.dothome.co.kr/images/og_contact.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon_index.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon_index.png">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css"
  >

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body,
      p,
      div,
      h1,
      h2,
      h3,
      form {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "SUIT", "나눔고딕", sans-serif;
        color: #fff8f2;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      img {
        display: block;
      }
      button,
      input,
      textarea {
        font-family: inherit;
      }
      .hide {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      :root {
        --w: min(780px, 92vw);
        --line: rgba(255, 255, 255, 0.14);
        --txt: #fff8f2;
      }

      .main {
        min-height: 100vh;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 140px;
      }
      .main::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        background: radial-gradient(
          70% 55% at 50% 35%,
          rgba(0, 0, 0, 0.15) 0%,
          rgba(0, 0, 0, 0.55) 70%,
          rgba(0, 0, 0, 0.72) 100%
        );
      }
      .login_bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }

      .info_card {
        position: relative;
        z-index: 1;
        width: var(--w);
        padding: 26px 24px 28px;
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(10px);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }

      .logo {
        text-align: center;
      }
      .logo_link {
        display: inline-block;
        position: relative;
        width: clamp(160px, 22vw, 300px);
        aspect-ratio: 300 / 95;
      }
      .logo_link img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .logo_default {
        opacity: 1;
        transition: opacity 0.2s ease;
      }
      .logo_hover {
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .logo_link:hover .logo_default,
      .logo_link:focus-visible .logo_default {
        opacity: 0;
      }
      .logo_link:hover .logo_hover,
      .logo_link:focus-visible .logo_hover {
        opacity: 1;
      }

      .title {
        text-align: center;
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 18px;
      }
      .section {
        border-top: 1px solid var(--line);
        padding-top: 18px;
      }

      .block {
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.04);
        margin-top: 14px;
      }
      .label {
        font-size: 13px;
        opacity: 0.8;
        margin-bottom: 8px;
        display: block;
        font-weight: 700;
      }
      .value {
        font-size: 15px;
        line-height: 1.6;
      }

      .form_grid {
        display: grid;
        gap: 24px;
      }

      .field input {
        width: 100%;
        height: 52px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(0, 0, 0, 0.2);
        color: var(--txt);
        border-radius: 14px;
        padding: 14px 14px 12px;
        font-size: 14px;
        line-height: 1.3;
        font-weight: 400;
        outline: none;
        transition:
          border-color 0.15s ease,
          background-color 0.15s ease;
      }

      .field textarea {
        width: 100%;
        min-height: 160px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(0, 0, 0, 0.2);
        color: var(--txt);
        border-radius: 14px;
        padding: 18px 14px;
        font-size: 14px;
        line-height: 1.7;
        outline: none;
        resize: vertical;
        transition:
          border-color 0.15s ease,
          background-color 0.15s ease;
      }

      .field input::placeholder,
      .field textarea::placeholder {
        color: rgba(255, 248, 242, 0.55);
      }

      .field input:focus,
      .field textarea:focus {
        border-color: rgba(255, 255, 255, 0.26);
        background: rgba(0, 0, 0, 0.26);
      }

      .dropdown {
        position: relative;
        width: 100%;
        height: 52px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.2);
        transition:
          border-color 0.15s ease,
          background-color 0.15s ease;
      }
      .dropdown:focus-within {
        border-color: rgba(255, 255, 255, 0.26);
        background: rgba(0, 0, 0, 0.26);
      }

      .dd_btn {
        width: 100%;
        height: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        padding: 0 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
      }

      .dd_text {
        font-size: 14px;
        line-height: 1;
        color: rgba(255, 248, 242, 0.7);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dropdown:not(.is-empty) .dd_text {
        color: #fff8f2;
      }

      .dd_chev {
        width: 10px;
        height: 10px;
        border-right: 2px solid rgba(255, 248, 242, 0.85);
        border-bottom: 2px solid rgba(255, 248, 242, 0.85);
        transform: rotate(45deg);
        opacity: 0.85;
        flex: 0 0 auto;
        margin-left: 10px;
      }

      .dd_list {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 10px);
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(18, 18, 18, 0.96);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        padding: 8px;
        list-style: none;
        display: none;
        z-index: 9999;
        max-height: 240px;
        overflow: auto;
      }
      .dropdown.open .dd_list {
        display: block;
      }

      .dd_item {
        padding: 12px 12px;
        border-radius: 10px;
        color: rgba(255, 248, 242, 0.92);
        font-size: 14px;
        cursor: pointer;
        transition:
          background 0.15s ease,
          transform 0.15s ease;
      }
      .dd_item:hover {
        background: rgba(244, 0, 9, 0.16);
        transform: translateY(-1px);
      }
      .dd_item:active {
        transform: scale(0.98);
      }

      .help_txt {
        margin-top: 4px;
        font-size: 13px;
        line-height: 1.6;
        opacity: 0.85;
      }

      .btn_row {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        width: 100%;
      }

      .btn {
        height: 54px;
        width: 100%;
        border: 0;
        padding: 0 24px;
        cursor: pointer;
        background-color: transparent;
        background-repeat: no-repeat;
        background-position: center;
        background-size: 100% 100%;
        color: var(--txt);
        font-weight: 800;
        font-size: clamp(14px, 3.2vw, 16px);
        letter-spacing: -0.2px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url("images/customer_btn.png");
        transition:
          transform 0.12s ease,
          filter 0.15s ease,
          background-image 0.15s ease;
      }
      .btn:hover,
      .btn:focus-visible {
        background-image: url("images/customer_btn_hover.png");
        transform: translateY(-1px);
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35));
      }
      .btn:active {
        transform: translateY(0) scale(0.97);
      }

      @media (max-width: 520px) {
        .main {
          padding-top: 110px;
        }
        .btn_row {
          grid-template-columns: 1fr;
        }
        .btn {
          height: 52px;
          font-size: 13px;
        }
        .field input,
        .field textarea,
        .dd_text,
        .dd_item {
          font-size: 10px;
        }
      }
    </style>
  </head>

  <body>
    <main class="main">
      <img src="images/login_bg.png" alt="" class="login_bg">

      <section class="info_card">
        <h1 class="logo">
          <a href="index.html" class="logo_link">
            <img
              src="images/cocacola_login_logo.png"
              alt="코카콜라"
              class="logo_default"
          >
            <img
              src="images/cocacola_login_logo_hover.png"
              alt=""
              class="logo_hover"
              aria-hidden="true"
          >
          </a>
        </h1>

        <h2 class="title">문의하기</h2>

        <div class="section">
          <div class="block">
            <span class="label">주소</span>
            <p class="value">
              서울시 종로구 새문안로 68 흥국생명빌딩 18층<br>
              한국 코카-콜라 (03184)
            </p>
          </div>

          <div class="block">
            <span class="label">코카-콜라 음료(주) 고객상담실</span>
            <p class="value">
              080-024-5999<br>
              (상담 시간: 월 ~ 금 09:00 ~ 17:30)
            </p>
          </div>

          <div class="block">
            <span class="label">문의 폼</span>

            <form
              class="form_grid"
              action="#none"
              method="post"
              onsubmit="return handleSubmit(event);"
            >
              <div class="field">
                <label class="hide" for="q_type_btn">문의 유형</label>
                <input type="hidden" id="q_type" name="q_type">

                <div class="dropdown is-empty" data-dd="qtype">
                  <button
                    type="button"
                    class="dd_btn"
                    id="q_type_btn"
                    role="combobox"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                    aria-controls="q_type_list"
                    aria-required="true"
                  >
                    <span class="dd_text" data-dd-text>문의 유형 선택*</span>
                    <span class="dd_chev" aria-hidden="true"></span>
                  </button>

                  <ul
                    class="dd_list"
                    id="q_type_list"
                    role="listbox"
                    aria-label="문의 유형"
                    tabindex="-1"
                  >
                    <li role="option" class="dd_item" data-value="product">
                      제품/성분
                    </li>
                    <li role="option" class="dd_item" data-value="purchase">
                      구매/유통
                    </li>
                    <li role="option" class="dd_item" data-value="event">
                      이벤트/프로모션
                    </li>
                    <li role="option" class="dd_item" data-value="service">
                      고객서비스
                    </li>
                    <li role="option" class="dd_item" data-value="etc">기타</li>
                  </ul>
                </div>
              </div>

              <div class="field">
                <label class="hide" for="name">이름</label>
                <input
                  id="name"
                  type="text"
                  name="name"
                  placeholder="이름*"
                  required
              >
              </div>

              <div class="field">
                <label class="hide" for="email">이메일</label>
                <input
                  id="email"
                  type="email"
                  name="email"
                  placeholder="이메일*"
                  required
              >
              </div>

              <div class="field">
                <label class="hide" for="subject">제목</label>
                <input
                  id="subject"
                  type="text"
                  name="subject"
                  placeholder="제목*"
                  required
              >
              </div>

              <div class="field">
                <label class="hide" for="message">문의 내용</label>
                <textarea
                  id="message"
                  name="message"
                  placeholder="문의 내용을 입력해 주세요*"
                  required
                ></textarea>
              </div>

              <p class="help_txt">
                * 접수된 문의는 확인 후 순차적으로 답변됩니다.<br>
                (상담 시간: 월 ~ 금 09:00 ~ 17:30)
              </p>

              <div class="btn_row">
                <button type="submit" class="btn">문의 접수</button>
                <button
                  type="button"
                  class="btn"
                  onclick="location.href = 'customer.html'"
                >
                  고객 안내
                </button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script>
      [
        "images/cocacola_login_logo_hover.png",
        "images/customer_btn_hover.png",
      ].forEach((src) => {
        const img = new Image();
        img.src = src;
      });

      function handleSubmit(e) {
        e.preventDefault();
        const form = e.target;

        const data = {
          type: (form.q_type?.value || "").trim(),
          name: (form.name?.value || "").trim(),
          email: (form.email?.value || "").trim(),
          subject: (form.subject?.value || "").trim(),
          message: (form.message?.value || "").trim(),
        };

        if (
          !data.type ||
          !data.name ||
          !data.email ||
          !data.subject ||
          !data.message
        ) {
          alert("필수 항목을 모두 입력해 주세요.");
          return false;
        }

        alert("문의가 접수되었습니다. 감사합니다!");
        form.reset();

        const dd = document.querySelector('[data-dd="qtype"]');
        if (dd) {
          dd.classList.add("is-empty");
          dd.classList.remove("open");
          const t = dd.querySelector("[data-dd-text]");
          if (t) t.textContent = "문의 유형 선택*";
          const hidden = document.getElementById("q_type");
          if (hidden) hidden.value = "";
        }
        return false;
      }

      (() => {
        const dd = document.querySelector('[data-dd="qtype"]');
        if (!dd) return;

        const btn = dd.querySelector(".dd_btn");
        const list = dd.querySelector(".dd_list");
        const text = dd.querySelector("[data-dd-text]");
        const hidden = document.getElementById("q_type");

        function openDD() {
          dd.classList.add("open");
          btn.setAttribute("aria-expanded", "true");
        }
        function closeDD() {
          dd.classList.remove("open");
          btn.setAttribute("aria-expanded", "false");
        }

        btn.addEventListener("click", (e) => {
          e.preventDefault();
          dd.classList.contains("open") ? closeDD() : openDD();
        });

        list.addEventListener("click", (e) => {
          const item = e.target.closest(".dd_item");
          if (!item) return;

          hidden.value = item.getAttribute("data-value");
          text.textContent = item.textContent;
          dd.classList.remove("is-empty");
          closeDD();
        });

        document.addEventListener("click", (e) => {
          if (!dd.contains(e.target)) closeDD();
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeDD();
        });
      })();
    </script>
  </body>
</html>
