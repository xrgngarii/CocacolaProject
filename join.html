<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코카콜라 회원가입 페이지</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="회원가입 | 코카콜라 - Pure Joy">
    <meta property="og:description" content="회원가입 UI를 구현한 Join 페이지입니다.">
    <meta property="og:url" content="https://tkdcjdyd8382.dothome.co.kr/join.html">
    <meta property="og:image" content="https://tkdcjdyd8382.dothome.co.kr/images/og_join.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="회원가입 | 코카콜라 - Pure Joy">
    <meta name="twitter:description" content="회원가입 UI를 구현한 Join 페이지입니다.">
    <meta name="twitter:image" content="https://tkdcjdyd8382.dothome.co.kr/images/og_join.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon_index.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon_index.png">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css"
  >
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body,
      p,
      div {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "SUIT", "나눔고딕", sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }
      ul,
      li {
        list-style: none;
      }
      a {
        text-decoration: none;
        color: #000;
      }
      address {
        font-style: normal;
      }
      img {
        display: block;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0;
      }
      .hide {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .header {
        display: none;
      }
      .main {
        padding-top: 0;
      }
      .footer {
        display: none;
      }
      :root {
        --input-h: 68px;
      }
      .main {
        min-height: 100vh;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 140px;
        box-sizing: border-box;
      }
      .main::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: radial-gradient(
          70% 55% at 50% 35%,
          rgba(0, 0, 0, 0.15) 0%,
          rgba(0, 0, 0, 0.55) 70%,
          rgba(0, 0, 0, 0.72) 100%
        );
      }
      .login_bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        z-index: 0;
      }
      :root {
        --h: 68px;
        --w: min(780px, 92vw);
        --gap: 22px;
        --txt: #fff8f2;
      }
      .join_form {
        position: relative;
        z-index: 1;
        width: var(--w);
        margin: 0 auto 10%;
        display: flex;
        flex-direction: column;
        padding: 26px 24px 28px;
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        animation: popIn 0.6s ease both;
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .join_form fieldset {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .join_form .logo {
        width: 100%;
        text-align: center;
      }
      .join_form .logo img {
        display: block;
        aspect-ratio: 300 / 95;
        width: clamp(160px, 22vw, 300px);
        height: auto;
        margin: 0 auto 36px;
      }
      .logo img {
        transition: transform 0.15s ease;
      }
      .logo_link {
        display: inline-block;
        position: relative;
        width: clamp(160px, 22vw, 300px);
        aspect-ratio: 300 / 95;
      }
      .logo_link img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .logo_default {
        opacity: 1;
        transition: opacity 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .logo_hover {
        opacity: 0;
        transition: opacity 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .logo_link:hover .logo_default,
      .logo_link:focus-visible .logo_default {
        opacity: 0;
      }
      .logo_link:hover .logo_hover,
      .logo_link:focus-visible .logo_hover {
        opacity: 1;
      }
      .logo img:active {
        transform: scale(0.97);
      }
      .frame {
        height: var(--h);
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
        display: flex;
        align-items: center;
      }
      .inp {
        width: 100%;
        height: 100%;
        padding: 0 26px;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--txt);
        font-family: inherit;
        font-size: 16px;
        line-height: 1;
        padding: 2px 26px 0;
      }
      .inp::placeholder {
        color: rgba(255, 248, 242, 0.7);
        letter-spacing: -0.2px;
      }
      .inp[readonly] {
        opacity: 0.85;
        cursor: default;
      }
      .inp[readonly]::placeholder {
        opacity: 0.9;
      }
      .frame-pw {
        background-image: url("images/join_pw_box.png");
      }
      .frame-id {
        background-image: url("images/join_id_box.png");
      }
      .frame-email {
        background-image: url("images/email_box.png");
      }
      .frame-email-right {
        background-image: url("images/email_right_box.png");
      }
      .frame-phone {
        background-image: url("images/phone_short_box.png");
      }
      .row {
        width: 100%;
      }
      .row-id {
        display: grid;
        grid-template-columns: 835fr 183fr;
        gap: var(--gap);
        align-items: center;
      }
      .row-addr {
        display: grid;
        grid-template-columns: 835fr 183fr;
        gap: var(--gap);
        align-items: center;
      }
      .row-email {
        display: grid;
        grid-template-columns: 401fr 401fr 214fr;
        gap: var(--gap);
        align-items: center;
        margin-bottom: 28px;
      }
      .row-bottom {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--gap);
        align-items: center;
        margin-top: 12px;
      }
      .row-phone {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: var(--gap);
        align-items: center;
      }
      .btn:hover {
        transform: translateY(-1px);
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35));
      }
      .btn:active {
        transform: translateY(0) scale(0.97);
      }
      .btn {
        height: var(--h);
        border: 0;
        padding: 0;
        cursor: pointer;
        background-color: transparent;
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
        color: var(--txt);
        font-family: inherit;
        transition:
          background-image 0.15s ease,
          transform 0.12s ease;
      }
      .btn-idcheck {
        background-image: url("images/join_id_check_btn.png");
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 500;
      }
      .btn-join {
        background-image: url("images/join_btn.png");
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: 700;
      }
      .btn-cancel {
        background-image: url("images/join_cancel_btn.png");
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: 700;
      }
      .agree {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 14px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(0, 0, 0, 0.12);
        margin: 20px 0 28px;
      }
      .agree input {
        margin-top: 2px;
        width: 18px;
        height: 18px;
        accent-color: #f40009;
        flex: 0 0 auto;
      }
      .agree span {
        font-size: clamp(12px, 3.2vw, 15px);
        line-height: 1.6;
        color: rgba(255, 248, 242, 0.82);
      }
      .dropdown {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .dd_btn {
        width: 100%;
        height: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        padding: 2px 26px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
      }
      .dd_text {
        font-size: 16px;
        line-height: 1;
        color: rgba(255, 248, 242, 0.7);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dropdown:not(.is-empty) .dd_text {
        color: #fff8f2;
      }
      .dd_chev {
        width: 10px;
        height: 10px;
        border-right: 2px solid rgba(255, 248, 242, 0.85);
        border-bottom: 2px solid rgba(255, 248, 242, 0.85);
        transform: rotate(45deg);
        opacity: 0.85;
        flex: 0 0 auto;
        margin-left: 10px;
      }
      .dd_list {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 10px);
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(18, 18, 18, 0.96);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        padding: 8px;
        list-style: none;
        display: none;
        z-index: 9999;
        max-height: 240px;
        overflow: auto;
      }
      .dropdown.open .dd_list {
        display: block;
      }
      .dd_item {
        padding: 12px 12px;
        border-radius: 10px;
        color: rgba(255, 248, 242, 0.92);
        font-size: 14px;
        cursor: pointer;
        transition:
          background 0.15s ease,
          transform 0.15s ease;
      }
      .dd_item:hover {
        background: rgba(244, 0, 9, 0.16);
        transform: translateY(-1px);
      }
      .dd_item:active {
        transform: scale(0.98);
      }
      @media (max-width: 560px) {
      :root{
        --h: 78px;
        --gap: 10px;
        --w: 100%;
      }

      .main {
        padding-top: 88px;
      }

      .join_form {
        width: 100%;
        max-width: 100%;
        padding: 18px 16px 20px;
        margin: 0 auto 10%;
        transform: none;
      }

      .row,
      .frame,
      .btn {
        min-width: 0;
      }

      .join_form fieldset {
        gap: 10px;
      }

      .join_form .logo img {
        margin: 0 auto 18px;
      }

      .row-email {
        margin-bottom: 10px;
      }

      .agree {
        margin: 10px 0 12px;
        padding: 10px;
      }

      .row-bottom {
        grid-template-columns: 1fr;
        gap: 8px;
        margin-top: 6px;
      }
      .frame{
        box-sizing: border-box;
        padding: 10px 0;
      }
      .inp,
      select.inp {
        height: 100%;
        padding: 0 18px;
        line-height: 1.25;
        font-size: 14px;
      }

      .inp::placeholder {
        font-size: 14px;
        line-height: 1.25;
      }

      .btn,
      .btn.btn-idcheck {
        font-size: 12px;
      }

      .btn-idcheck {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: -0.2px;
        line-height: 1;
      }

      .dd_btn {
        height: 100%;
        padding: 0 14px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
      }

      .dd_text {
        font-size: 14px;
        line-height: 1;
        flex: 1 1 auto;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .dd_chev {
        flex: 0 0 auto;
        margin-left: 0;
      }

      .dd_list {
        top: calc(100% + 6px);
        border-radius: 12px;
        left: auto;
        right: 0;
        width: max-content;
        min-width: 180px;
        max-width: calc(100vw - 24px);
      }

      .dd_item {
        white-space: nowrap;
        font-size: 12px;
        padding: 10px 12px;
      }
      #join_pw::placeholder {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
       .agree{
        display: grid;
        grid-template-columns: 18px 1fr;
        column-gap: 12px;
        align-items: center;
        padding: 12px;
      }

      .agree input{
        margin: 0;
        width: 18px;
        height: 18px;
      }

      .agree span{
        font-size: 13px;
        line-height: 1.45;
      }
    }
    @media (min-width: 390px) and (max-width: 430px) and (orientation: portrait) {
      .join_form {
        transform-origin: top center;
      }
      :root {
        --gap: 26px;
      }
      .agree span {
        font-size: 10px;
      }
    }
    .agree_txt--m{ display:none; }

    @media (max-width:560px){
      .agree_txt--pc{ display:none; }
      .agree_txt--m{ display:inline; }
    }
    </style>
  </head>
  <body>
    <main id="main" class="main">
      <img
        src="images/login_bg.png"
        alt="로그인&회원가입 바탕 화면"
        class="login_bg"
    >
      <form class="join_form" action="#none" method="post">
        <fieldset>
          <legend class="hide">회원가입</legend>
          <h1 class="logo">
            <a href="index.html" class="logo_link">
              <img
                src="images/cocacola_login_logo.png"
                alt="코카콜라"
                class="logo_default"
            >
              <img
                src="images/cocacola_login_logo_hover.png"
                alt=""
                class="logo_hover"
                aria-hidden="true"
            >
            </a>
          </h1>
          <div class="row row-id">
            <div class="frame frame-id">
              <label class="hide" for="join_id">아이디</label>
              <input
                class="inp"
                type="text"
                name="id"
                id="join_id"
                placeholder="아이디* (영문소문자/숫자, 4~16자)"
                required
            >
            </div>
            <button type="button" class="btn btn-idcheck">아이디 확인</button>
          </div>
          <div class="frame frame-pw">
            <label class="hide" for="join_pw">비밀번호</label>
            <input
              class="inp"
              type="password"
              name="pw"
              id="join_pw"
              placeholder="비밀번호* (영문 대소문자/숫자/특수문자 중 2가지 이상 조합, 8자~16자)"
              required
          >
          </div>
          <div class="frame frame-pw">
            <label class="hide" for="join_pw2">비밀번호 확인</label>
            <input
              class="inp"
              type="password"
              name="pw2"
              id="join_pw2"
              placeholder="비밀번호 확인*"
              required
          >
          </div>
          <div class="row row-addr">
            <div class="frame frame-id">
              <label class="hide" for="addr0">주소</label>
              <input
                class="inp"
                type="text"
                name="addr0"
                id="addr0"
                placeholder="주소"
                readonly
            >
            </div>
            <button type="button" class="btn btn-idcheck">우편번호</button>
          </div>
          <div class="frame frame-pw">
            <label class="hide" for="addr1">기본주소</label>
            <input
              class="inp"
              type="text"
              name="addr1"
              id="addr1"
              placeholder="기본주소"
              readonly
          >
          </div>
          <div class="frame frame-pw">
            <label class="hide" for="addr2">상세주소</label>
            <input
              class="inp"
              type="text"
              name="addr2"
              id="addr2"
              placeholder="나머지주소 (선택입력가능)"
          >
          </div>
          <div class="row row-phone">
            <div class="frame frame-phone">
              <label class="hide" for="tel_home1">일반전화 앞자리</label>
              <input
                class="inp"
                type="text"
                name="tel_home1"
                id="tel_home1"
                maxlength="3"
                inputmode="numeric"
            >
            </div>
            <div class="frame frame-phone">
              <label class="hide" for="tel_home2">일반전화 가운데자리</label>
              <input
                class="inp"
                type="text"
                name="tel_home2"
                id="tel_home2"
                maxlength="4"
                placeholder="*일반전화"
                inputmode="numeric"
            >
            </div>
            <div class="frame frame-phone">
              <label class="hide" for="tel_home3">일반전화 끝자리</label>
              <input
                class="inp"
                type="text"
                name="tel_home3"
                id="tel_home3"
                maxlength="4"
                inputmode="numeric"
            >
            </div>
          </div>
          <div class="row row-phone">
            <div class="frame frame-phone">
              <label class="hide" for="tel_mobile1">휴대전화 앞자리</label>
              <input
                class="inp"
                type="text"
                name="tel_mobile1"
                id="tel_mobile1"
                maxlength="3"
                inputmode="numeric"
            >
            </div>
            <div class="frame frame-phone">
              <label class="hide" for="tel_mobile2">휴대전화 가운데자리</label>
              <input
                class="inp"
                type="text"
                name="tel_mobile2"
                id="tel_mobile2"
                maxlength="4"
                placeholder="*휴대전화"
                inputmode="numeric"
            >
            </div>
            <div class="frame frame-phone">
              <label class="hide" for="tel_mobile3">휴대전화 끝자리</label>
              <input
                class="inp"
                type="text"
                name="tel_mobile3"
                id="tel_mobile3"
                maxlength="4"
                inputmode="numeric"
            >
            </div>
          </div>
          <!-- 이메일 (예: 아이디 / 도메인 / 선택) -->
          <div class="row row-email">
            <div class="frame frame-email">
              <label class="hide" for="email1">이메일 아이디</label>
              <input
                class="inp"
                type="text"
                name="email1"
                id="email1"
                placeholder="이메일*"
                required
            >
            </div>
            <div class="frame frame-email">
              <label class="hide" for="email2">이메일 도메인 직접입력</label>
              <input
                class="inp"
                type="text"
                name="email2"
                id="email2"
                placeholder=""
            >
            </div>
            <div class="frame frame-email-right">
              <label class="hide" for="email_domain_btn"
                >이메일 도메인 선택</label
              >
              <input
                type="hidden"
                id="email_domain"
                name="email_domain"
            >
              <div class="dropdown dropdown--email is-empty" data-dd="email">
                <button
                  type="button"
                  class="dd_btn"
                  id="email_domain_btn"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                >
                  <span class="dd_text" data-dd-text>선택</span>
                  <span class="dd_chev" aria-hidden="true"></span>
                </button>
                <ul
                  class="dd_list"
                  role="listbox"
                  aria-label="이메일 도메인"
                  tabindex="-1"
                >
                  <li role="option" class="dd_item" data-value="naver.com">
                    naver.com
                  </li>
                  <li role="option" class="dd_item" data-value="daum.net">
                    daum.net
                  </li>
                  <li role="option" class="dd_item" data-value="gmail.com">
                    gmail.com
                  </li>
                  <li role="option" class="dd_item" data-value="hanmail.net">
                    hanmail.net
                  </li>
                  <li role="option" class="dd_item" data-value="nate.com">
                    nate.com
                  </li>
                  <li role="option" class="dd_item" data-value="custom">
                    직접입력
                  </li>
                </ul>
              </div>
            </div>
          </div>
          <!-- 체크박스 -->
          <label class="agree">
            <input type="checkbox" name="agree_all" required>
            <span class="agree_txt agree_txt--pc">
              이용약관 및 개인정보수집 및 이용, 쇼핑정보 수신(선택)에 모두 동의합니다. *
            </span>
            <span class="agree_txt agree_txt--m" aria-hidden="true">
              이용약관·개인정보 수집/이용 동의 *
            </span>
          </label>
          <!-- 하단 버튼 2개 -->
          <div class="row row-bottom">
            <button type="submit" class="btn btn-join">회원가입</button>
            <button
              type="button"
              class="btn btn-cancel"
              onclick="location.href='index.html'"
            >
              회원가입취소
            </button>
          </div>
        </fieldset>
      </form>
    </main>
    <script>
      [
        "images/cocacola_login_logo_hover.png",
        "images/join_btn_hover.png",
        "images/join_cancel_btn_hover.png",
        "images/join_id_check_btn_hover.png",
      ].forEach((src) => {
        const img = new Image();
        img.src = src;
      });
      const logoImg = document.querySelector(".logo img");
      if (logoImg) {
        const joinBtn = document.querySelector(".btn-join");
        if (joinBtn) {
          joinBtn.addEventListener("mouseenter", () => {
            joinBtn.style.backgroundImage =
              'url("images/join_btn_hover.png")';
          });
          joinBtn.addEventListener("mouseleave", () => {
            joinBtn.style.backgroundImage = 'url("images/join_btn.png")';
          });
        }
        const cancelBtn = document.querySelector(".btn-cancel");
        if (cancelBtn) {
          cancelBtn.addEventListener("mouseenter", () => {
            cancelBtn.style.backgroundImage =
              'url("images/join_cancel_btn_hover.png")';
          });
          cancelBtn.addEventListener("mouseleave", () => {
            cancelBtn.style.backgroundImage =
              'url("images/join_cancel_btn.png")';
          });
          cancelBtn.addEventListener("click", () => {
           location.href = "index.html";
        });
        }
        document.querySelectorAll(".btn-idcheck").forEach((btn) => {
          btn.addEventListener("mouseenter", () => {
            btn.style.backgroundImage =
              'url("images/join_id_check_btn_hover.png")';
          });
          btn.addEventListener("mouseleave", () => {
            btn.style.backgroundImage =
              'url("images/join_id_check_btn.png")';
          });
        });
        function onlyDigits(el) {
          el.value = el.value.replace(/\D/g, "");
        }
        function bindAutoNext(curr, next, maxLen) {
          if (!curr) return;
          curr.addEventListener("input", () => {
            onlyDigits(curr);
            if (curr.value.length >= maxLen && next) next.focus();
          });
        }
        function bindBackPrev(curr, prev) {
          if (!curr) return;
          curr.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" && curr.value.length === 0 && prev)
              prev.focus();
          });
        }
        const h1 = document.getElementById("tel_home1");
        const h2 = document.getElementById("tel_home2");
        const h3 = document.getElementById("tel_home3");
        bindAutoNext(h1, h2, 3);
        bindAutoNext(h2, h3, 4);
        bindBackPrev(h2, h1);
        bindBackPrev(h3, h2);
        const m1 = document.getElementById("tel_mobile1");
        const m2 = document.getElementById("tel_mobile2");
        const m3 = document.getElementById("tel_mobile3");
        bindAutoNext(m1, m2, 3);
        bindAutoNext(m2, m3, 4);
        bindBackPrev(m2, m1);
        bindBackPrev(m3, m2);
      }
      (() => {
        const dd = document.querySelector('[data-dd="email"]');
        if (!dd) return;
        const btn = dd.querySelector(".dd_btn");
        const list = dd.querySelector(".dd_list");
        const text = dd.querySelector("[data-dd-text]");
        const hidden = document.getElementById("email_domain");
        const email2 = document.getElementById("email2");
        function openDD() {
          dd.classList.add("open");
          btn.setAttribute("aria-expanded", "true");
        }
        function closeDD() {
          dd.classList.remove("open");
          btn.setAttribute("aria-expanded", "false");
        }
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          dd.classList.contains("open") ? closeDD() : openDD();
        });
        list.addEventListener("click", (e) => {
          const item = e.target.closest(".dd_item");
          if (!item) return;
          const val = item.getAttribute("data-value");
          if (val === "custom") {
            hidden.value = "";
            text.textContent = "직접입력";
            dd.classList.remove("is-empty");
            closeDD();
            if (email2) {
              email2.value = "";
              email2.placeholder = "도메인 직접입력 (예: gmail.com)";
              email2.focus();
            }
            return;
          }
          hidden.value = val;
          text.textContent = val;
          dd.classList.remove("is-empty");
          closeDD();
          if (email2) {
            email2.value = val;
            email2.placeholder = "";
          }
        });
        document.addEventListener("click", (e) => {
          if (!dd.contains(e.target)) closeDD();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeDD();
        });
      })();
    </script>
    <script>
      (() => {
        const pw = document.getElementById("join_pw");
        if (!pw) return;

        const full =
          "비밀번호* (영문 대소문자/숫자/특수문자 중 2가지 이상 조합, 8자~16자)";
        const short = "비밀번호* (2종 조합, 8~16자)";

        const apply = () => {
          pw.placeholder = window.matchMedia("(max-width: 560px)").matches
            ? short
            : full;
        };

        apply();
        window.addEventListener("resize", apply);
      })();
    </script>
  </body>
</html>
