<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코카콜라 고객 안내</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="고객안내 | 코카콜라 - Pure Joy">
    <meta property="og:description" content="고객 안내 정보를 정리한 Customer 페이지입니다.">
    <meta property="og:url" content="https://tkdcjdyd8382.dothome.co.kr/customer.html">
    <meta property="og:image" content="https://tkdcjdyd8382.dothome.co.kr/images/og_customer.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="고객안내 | 코카콜라 - Pure Joy">
    <meta name="twitter:description" content="고객 안내 정보를 정리한 Customer 페이지입니다.">
    <meta name="twitter:image" content="https://tkdcjdyd8382.dothome.co.kr/images/og_customer.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon_index.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon_index.png">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css"
  >

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }s
      body,
      p,
      div,
      h1,
      h2,
      h3,
      section {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "SUIT", "나눔고딕", sans-serif;
        color: #fff8f2;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      img {
        display: block;
      }
      button {
        font-family: inherit;
      }
      .hide {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      :root {
        --w: min(780px, 92vw);
        --line: rgba(255, 255, 255, 0.14);
        --txt: #fff8f2;
      }

      .main {
        min-height: 100vh;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 140px;
      }
      .main::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        background: radial-gradient(
          70% 55% at 50% 35%,
          rgba(0, 0, 0, 0.15) 0%,
          rgba(0, 0, 0, 0.55) 70%,
          rgba(0, 0, 0, 0.72) 100%
        );
      }
      .login_bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }

      .info_card {
        position: relative;
        z-index: 1;
        width: var(--w);
        padding: 26px 24px 28px;
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(10px);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }

      .logo {
        text-align: center;
      }
      .logo_link {
        display: inline-block;
        position: relative;
        width: clamp(160px, 22vw, 300px);
        aspect-ratio: 300 / 95;
      }
      .logo_link img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .logo_default {
        opacity: 1;
        transition: opacity 0.2s ease;
      }
      .logo_hover {
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .logo_link:hover .logo_default,
      .logo_link:focus-visible .logo_default {
        opacity: 0;
      }
      .logo_link:hover .logo_hover,
      .logo_link:focus-visible .logo_hover {
        opacity: 1;
      }

      .title {
        text-align: center;
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 18px;
      }
      .section {
        border-top: 1px solid var(--line);
        padding-top: 18px;
      }

      .block {
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.04);
        margin-top: 14px;
      }
      .label {
        font-size: 13px;
        opacity: 0.8;
        margin-bottom: 8px;
        display: block;
        font-weight: 700;
      }
      .value {
        font-size: 15px;
        line-height: 1.6;
      }

      .list {
        margin-top: 8px;
        padding-left: 18px;
        opacity: 0.92;
        line-height: 1.7;
        font-size: 14px;
      }
      .list li {
        margin-top: 6px;
      }

      .btn_row{
        margin-top: 18px;
        display: flex;
        justify-content: center;
        width: 100%;
      }

      .btn{
        height: 50px;
        width: auto;
        min-width: 280px;
        max-width: 420px;
        padding: 0 54px;
        border: 0;
        cursor: pointer;

        background-color: transparent;
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;

        color: var(--txt);
        font-weight: 800;
        font-size: clamp(14px, 3.2vw, 16px);
        letter-spacing: -0.2px;

        display: flex;
        align-items: center;
        justify-content: center;

        transition:
          transform 0.12s ease,
          filter 0.15s ease,
          background-image 0.15s ease;
      }

      .btn-customer {
        background-image: url("images/customer_btn.png");
      }
      .btn-customer:hover,
      .btn-customer:focus-visible {
        background-image: url("images/customer_btn_hover.png");
        transform: translateY(-1px);
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35));
      }
      .btn:active {
        transform: translateY(0) scale(0.97);
      }

      @media (max-width: 520px) {
        .main {
          padding-top: 110px;
        }
        .btn {
          height: 52px;
          font-size: 13px;
        }
        .value {
          font-size: 14px;
        }
        .list {
          font-size: 13px;
        }
      }
    </style>
  </head>

  <body>
    <main class="main">
      <img src="images/login_bg.png" alt="" class="login_bg">

      <section class="info_card">
        <h1 class="logo">
          <a href="index.html" class="logo_link">
            <img
              src="images/cocacola_login_logo.png"
              alt="코카콜라"
              class="logo_default"
          >
            <img
              src="images/cocacola_login_logo_hover.png"
              alt=""
              class="logo_hover"
              aria-hidden="true"
          >
          </a>
        </h1>

        <h2 class="title">고객 안내</h2>

        <div class="section">
          <div class="block">
            <span class="label">주소</span>
            <p class="value">
              서울시 종로구 새문안로 68 흥국생명빌딩 18층<br>
              한국 코카-콜라 (03184)
            </p>
          </div>

          <div class="block">
            <span class="label">코카-콜라 음료(주) 고객상담실</span>
            <p class="value">
              080-024-5999<br>
              (상담 시간: 월 ~ 금 09:00 ~ 17:30)
            </p>
          </div>

          <div class="block">
            <span class="label">안내</span>
            <p class="value">문의 접수는 상담 시간 내 순차 처리됩니다.</p>
            <ul class="list">
              <li>제품/성분, 구매/유통, 이벤트 관련 문의 가능</li>
              <li>개인정보/환불 등 민감 문의는 상담실로 연락 권장</li>
              <li>답변은 입력하신 이메일로 안내됩니다</li>
            </ul>
          </div>

          <div class="btn_row">
            <button
              type="button"
              class="btn btn-customer"
              onclick="location.href = 'contact.html'"
            >
              문의하기
            </button>
          </div>
        </div>
      </section>
    </main>

    <script>
      [
        "images/cocacola_login_logo_hover.png",
        "images/customer_btn_hover.png",
      ].forEach((src) => {
        const img = new Image();
        img.src = src;
      });
    </script>
  </body>
</html>
