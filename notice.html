<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코카콜라 공지사항</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="공지사항 | 코카콜라 - Pure Joy">
    <meta property="og:description" content="공지사항 리스트 UI를 구현한 Notice 페이지입니다.">
    <meta property="og:url" content="https://tkdcjdyd8382.dothome.co.kr/notice.html">
    <meta property="og:image" content="https://tkdcjdyd8382.dothome.co.kr/images/og_notice.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="공지사항 | 코카콜라 - Pure Joy">
    <meta name="twitter:description" content="공지사항 리스트 UI를 구현한 Notice 페이지입니다.">
    <meta name="twitter:image" content="https://tkdcjdyd8382.dothome.co.kr/images/og_notice.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon_index.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon_index.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css">
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body,
      p,
      div,
      h1,
      h2,
      h3,
      section,
      ul,
      li,
      button,
      input {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "SUIT", "나눔고딕", sans-serif;
        color: #fff8f2;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      img {
        display: block;
      }
      button {
        font-family: inherit;
      }
      ul {
        list-style: none;
      }
      .hide {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      :root {
        --w: min(860px, 92vw);
        --line: rgba(255, 255, 255, 0.14);
        --txt: #fff8f2;
        --glass: rgba(0, 0, 0, 0.18);
        --chip: rgba(255, 255, 255, 0.06);
        --chipLine: rgba(255, 255, 255, 0.12);
        --soft: rgba(255, 255, 255, 0.04);
        --focus: rgba(255, 255, 255, 0.65);
      }

      .main {
        min-height: 100vh;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 140px;
        padding-bottom: 44px;
      }
      .main::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        background: radial-gradient(
          70% 55% at 50% 35%,
          rgba(0, 0, 0, 0.15) 0%,
          rgba(0, 0, 0, 0.55) 70%,
          rgba(0, 0, 0, 0.72) 100%
        );
      }
      .login_bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }

      .info_card {
        position: relative;
        z-index: 1;
        width: var(--w);
        padding: 26px 24px 28px;
        border-radius: 22px;
        background: var(--glass);
        backdrop-filter: blur(10px);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }

      .logo {
        text-align: center;
        margin-bottom: 6px;
      }
      .logo_link {
        display: inline-block;
        position: relative;
        width: clamp(160px, 22vw, 300px);
        aspect-ratio: 300 / 95;
        outline: none;
      }
      .logo_link img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .logo_default {
        opacity: 1;
        transition: opacity 0.2s ease;
      }
      .logo_hover {
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .logo_link:hover .logo_default,
      .logo_link:focus-visible .logo_default {
        opacity: 0;
      }
      .logo_link:hover .logo_hover,
      .logo_link:focus-visible .logo_hover {
        opacity: 1;
      }
      .logo_link:focus-visible {
        border-radius: 14px;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18);
      }

      .title {
        text-align: center;
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 18px;
      }

      .section {
        border-top: 1px solid var(--line);
        padding-top: 18px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        margin-bottom: 14px;
      }

      .search {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      .search:focus-within {
        border-color: rgba(255, 255, 255, 0.35);
        transform: translateY(-1px);
      }
      .search_icon {
        width: 18px;
        height: 18px;
        opacity: 0.8;
        flex: 0 0 auto;
        display: block;
        color: rgba(255, 248, 242, 0.9);
      }
      .search_icon path {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .search input {
        width: 100%;
        background: transparent;
        border: 0;
        outline: none;
        color: var(--txt);
        font-size: 14px;
        letter-spacing: -0.1px;
      }
      .search input::placeholder {
        color: rgba(255, 248, 242, 0.65);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        border: 1px solid var(--chipLine);
        background: var(--chip);
        color: rgba(255, 248, 242, 0.92);
        padding: 10px 12px;
        border-radius: 999px;
        font-weight: 800;
        font-size: 12px;
        letter-spacing: -0.1px;
        cursor: pointer;
        transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
        user-select: none;
      }
      .chip:hover,
      .chip:focus-visible {
        transform: translateY(-1px);
        border-color: rgba(244, 0, 9, 0.45);
        background: rgba(244, 0, 9, 0.08);
      }
      .chip[aria-pressed="true"] {
        border-color: rgba(244, 0, 9, 0.55);
        background: rgba(244, 0, 9, 0.12);
      }

      .chip:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(244, 0, 9, 0.18);
      }

      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        opacity: 0.86;
        font-size: 12px;
      }
      .meta strong {
        font-weight: 800;
        opacity: 1;
      }

      .notice_list {
        margin-top: 14px;
        display: grid;
        gap: 10px;
      }

      .notice {
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: var(--soft);
        overflow: hidden;
        transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
      }
      .notice:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.06);
      }

      .notice_head {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 14px 14px;
        background: transparent;
        border: 0;
        color: var(--txt);
        cursor: pointer;
        text-align: left;
      }
      .notice_head:focus-visible {
        outline: none;
        box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.16);
      }

      .notice_title {
        font-weight: 900;
        font-size: 14px;
        line-height: 1.35;
        letter-spacing: -0.2px;
      }
      .notice_sub {
        margin-top: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        opacity: 0.86;
        font-size: 12px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(0, 0, 0, 0.14);
        font-weight: 800;
      }
      .badge_dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(244, 0, 9, 0.95);
      }

      .chev {
        width: 36px;
        height: 36px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.14);
        display: grid;
        place-items: center;
        transition: transform 0.18s ease, border-color 0.15s ease, background 0.15s ease;
        flex: 0 0 auto;
      }
      .notice[aria-expanded="true"] .chev {
        transform: rotate(180deg);
        border-color: rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.2);
      }
      .chev svg {
        width: 18px;
        height: 18px;
        opacity: 0.9;
      }

      .notice_panel {
        height: 0;
        overflow: hidden;
        transition: height 0.22s ease;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .notice_body {
        padding: 14px 14px 16px;
      }
      .notice_body p {
        font-size: 14px;
        line-height: 1.7;
        opacity: 0.92;
      }
      .notice_body ul {
        margin-top: 10px;
        padding-left: 18px;
        line-height: 1.7;
        font-size: 13px;
        opacity: 0.9;
      }
      .notice_body li {
        margin-top: 6px;
      }
      .notice_linkrow {
        margin-top: 12px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .linkbtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.14);
        font-weight: 900;
        font-size: 12px;
        cursor: pointer;
        transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
        color: var(--txt);
      }
      .linkbtn:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.22);
        background: rgba(0, 0, 0, 0.2);
        color: var(--txt);
      }
      .linkbtn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18);
      }

      .empty {
        margin-top: 12px;
        padding: 18px 14px;
        border-radius: 16px;
        border: 1px dashed rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.03);
        opacity: 0.9;
        font-size: 14px;
        line-height: 1.7;
      }

      .btn_row {
        margin-top: 18px;
        display: flex;
        justify-content: center;
        width: 100%;
      }

      .btn {
        height: 54px;
        width: min(320px, 100%);
        border: 0;
        padding: 0 24px;
        cursor: pointer;
        background-color: transparent;
        background-repeat: no-repeat;
        background-position: center;
        background-size: 100% 100%;
        color: var(--txt);
        font-weight: 800;
        font-size: clamp(14px, 3.2vw, 16px);
        letter-spacing: -0.2px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.12s ease, filter 0.15s ease, background-image 0.15s ease;
      }

      .btn-customer {
        background-image: url("images/customer_btn.png");
      }
      .btn-customer:hover,
      .btn-customer:focus-visible {
        background-image: url("images/customer_btn_hover.png");
        transform: translateY(-1px);
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35));
      }
      .btn:active {
        transform: translateY(0) scale(0.97);
      }
      
      .notice_head:hover .chev,
      .notice_head:focus-visible .chev {
        border-color: rgba(244, 0, 9, 0.45);
        background: rgba(244, 0, 9, 0.08);
      }

      .notice_head:hover .chev svg path,
      .notice_head:focus-visible .chev svg path {
        fill: rgba(255, 248, 242, 0.95);
      }

      .notice[aria-expanded="true"] .chev {
        border-color: rgba(244, 0, 9, 0.45);
        background: rgba(244, 0, 9, 0.08);
      }
      @media (max-width: 520px) {
        .main {
          padding-top: 110px;
        }
        .title {
          font-size: 20px;
        }
        .notice_title {
          font-size: 13px;
        }
        .btn {
          height: 52px;
          font-size: 13px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .notice_panel,
        .notice,
        .chip,
        .btn,
        .linkbtn,
        .search {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="main">
      <img src="images/login_bg.png" alt="" class="login_bg">

      <section class="info_card" aria-label="공지사항">
        <h1 class="logo">
          <a href="index.html" class="logo_link">
            <img src="images/cocacola_login_logo.png" alt="코카콜라" class="logo_default">
            <img src="images/cocacola_login_logo_hover.png" alt="" class="logo_hover" aria-hidden="true">
          </a>
        </h1>

        <h2 class="title">공지사항</h2>

        <div class="section">
          <div class="toolbar" role="region" aria-label="공지 검색 및 필터">
            <div class="search">
              <svg class="search_icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10.5 18.5a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"></path>
                <path d="M16.5 16.5 21 21"></path>
              </svg>
              <label class="hide" for="q">공지 검색</label>
              <input id="q" type="search" placeholder="예: 개인정보, 이벤트, 점검" autocomplete="off">
            </div>

            <div class="chips" role="group" aria-label="카테고리 필터">
              <button type="button" class="chip" data-filter="all" aria-pressed="true">전체</button>
              <button type="button" class="chip" data-filter="policy" aria-pressed="false">약관·정책</button>
              <button type="button" class="chip" data-filter="event" aria-pressed="false">이벤트</button>
              <button type="button" class="chip" data-filter="service" aria-pressed="false">서비스</button>
            </div>

            <div class="meta" aria-live="polite">
              <span>표시 중 <strong id="count">0</strong>건</span>
              <span id="hint">항목을 눌러 상세를 펼칠 수 있어요</span>
            </div>
          </div>

          <div id="list" class="notice_list" role="list"></div>
          <div id="empty" class="empty" hidden>
            검색 조건에 맞는 공지사항이 없습니다.<br>
            다른 키워드로 다시 시도해 주세요.
          </div>

          <div class="btn_row">
            <button type="button" class="btn btn-customer" onclick="location.href='contact.html'">
              문의하기
            </button>
          </div>
        </div>
      </section>
    </main>

    <script>
      const notices = [
        {
          id: "n-2025-12-21",
          cat: "policy",
          badge: "약관·정책",
          title: "CokePLAY 개인정보 처리방침 개정 안내",
          date: "2025-12-21",
          summary: "개정 사항 및 적용 일정은 공지 원문에서 확인해 주세요.",
          bullets: ["개정 내용 확인", "적용 일정 확인", "문의는 고객센터로 접수"],
          sourceUrl: "https://cokeplay.cocacola.co.kr/customer/board/list"
        },
        {
          id: "n-2025-11-28",
          cat: "policy",
          badge: "약관·정책",
          title: "CokePLAY 개인정보 처리방침(스토어) 개정 안내",
          date: "2025-11-28",
          summary: "스토어 영역 개인정보 처리방침 개정 공지입니다.",
          bullets: ["스토어 정책 변경사항 확인", "시행일자 확인", "관련 문의 접수"],
          sourceUrl: "https://cokeplay.cocacola.co.kr/customer/board/list"
        },
        {
          id: "n-2025-08-13",
          cat: "event",
          badge: "이벤트",
          title: "코카-콜라 <CokePLAY LIVE 7월> 이벤트 당첨자 안내",
          date: "2025-08-13",
          summary: "당첨자 및 경품 안내는 공지 원문을 확인해 주세요.",
          bullets: ["당첨자 안내", "경품/배송 관련 유의사항", "문의 채널 안내"],
          sourceUrl: "https://cokeplay.cocacola.co.kr/customer/board/list"
        },
        {
          id: "n-2025-02-24",
          cat: "service",
          badge: "서비스",
          title: "코-크 플레이 카드 잔액 반환 신청방법 안내",
          date: "2025-02-24",
          summary: "잔액 반환 절차 및 접수 방법을 안내하는 공지입니다.",
          bullets: ["신청 절차 확인", "접수 시 필요한 정보 준비", "처리 기간 확인"],
          sourceUrl: "https://cokeplay.cocacola.co.kr/customer/board/list"
        },
        {
          id: "n-2022-11-10",
          cat: "policy",
          badge: "약관·정책",
          title: "CokePLAY 개인정보 처리방침 이용약관 변경 안내",
          date: "2022-11-10",
          summary: "SNS 회원가입 시 수집 항목을 구체적으로 명시하는 내용이 포함됩니다.",
          bullets: [
            "변경 사항: SNS를 통한 회원가입 시 수집 항목 구체화",
            "예: 카카오 Authorize Code, Apple ID_Token 등(서비스 안내 기준)",
            "동의하지 않을 경우 회원 탈퇴 경로 안내"
          ],
          sourceUrl: "https://cokeplay.cocacola.co.kr/customer/board/view?noticeSeq=188"
        }
      ];

      const $list = document.getElementById("list");
      const $q = document.getElementById("q");
      const $chips = Array.from(document.querySelectorAll(".chip"));
      const $count = document.getElementById("count");
      const $empty = document.getElementById("empty");

      let activeFilter = "all";

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function matches(n, q, filter) {
        const inFilter = filter === "all" ? true : n.cat === filter;
        if (!inFilter) return false;
        const needle = q.trim().toLowerCase();
        if (!needle) return true;
        const hay = (n.title + " " + n.summary + " " + (n.bullets || []).join(" ")).toLowerCase();
        return hay.includes(needle);
      }

      function render() {
        const q = $q.value || "";
        const filtered = notices.filter((n) => matches(n, q, activeFilter));
        $count.textContent = String(filtered.length);

        $list.innerHTML = filtered
        .map((n) => {
          const title = escapeHtml(n.title);
          const date = escapeHtml(n.date);
          const badge = escapeHtml(n.badge);
          const summary = escapeHtml(n.summary);
          const bullets = (n.bullets || []).map((b) => `<li>${escapeHtml(b)}</li>`).join("");
          const panelId = `${n.id}-panel`;
          const btnId = `${n.id}-btn`;

          return `
            <article class="notice" role="listitem" aria-expanded="false" data-id="${escapeHtml(n.id)}" data-cat="${escapeHtml(n.cat)}">
              <button type="button" class="notice_head" id="${btnId}" aria-controls="${panelId}" aria-expanded="false">
                <div>
                  <div class="notice_title">${title}</div>
                  <div class="notice_sub">
                    <span class="badge"><span class="badge_dot" aria-hidden="true"></span>${badge}</span>
                    <span>${date}</span>
                  </div>
                </div>
                <span class="chev" aria-hidden="true">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M12 15.5 5.5 9l1.4-1.4L12 12.7l5.1-5.1L18.5 9 12 15.5Z"></path>
                  </svg>
                </span>
              </button>

              <div class="notice_panel" id="${panelId}" role="region" aria-labelledby="${btnId}">
                <div class="notice_body">
                  <p>${summary}</p>
                  <ul>${bullets}</ul>
                  <div class="notice_linkrow">
                    <a class="linkbtn" href="${escapeHtml(n.sourceUrl)}" target="_blank" rel="noopener noreferrer">
                      공지 출처 보기
                    </a>
                    <button type="button" class="linkbtn" data-copy="${escapeHtml(n.sourceUrl)}">
                      출처 링크 복사
                    </button>
                  </div>
                </div>
              </div>
            </article>
          `;
        })
        .join("");

        $empty.hidden = filtered.length !== 0;

        wireAccordions();
        wireCopyButtons();
      }

      function closeAll(exceptId) {
        const items = Array.from(document.querySelectorAll(".notice"));
        items.forEach((item) => {
          const id = item.getAttribute("data-id");
          if (exceptId && id === exceptId) return;
          setExpanded(item, false);
        });
      }

      function setExpanded(item, expanded) {
        const btn = item.querySelector(".notice_head");
        const panel = item.querySelector(".notice_panel");
        if (!btn || !panel) return;

        item.setAttribute("aria-expanded", expanded ? "true" : "false");
        btn.setAttribute("aria-expanded", expanded ? "true" : "false");

        if (!expanded) {
          panel.style.height = panel.scrollHeight + "px";
          requestAnimationFrame(() => {
            panel.style.height = "0px";
          });
          return;
        }

        const target = panel.scrollHeight;
        panel.style.height = target + "px";

        const onEnd = (e) => {
          if (e.propertyName !== "height") return;
          panel.removeEventListener("transitionend", onEnd);
          if (item.getAttribute("aria-expanded") === "true") {
            panel.style.height = "auto";
          }
        };
        panel.addEventListener("transitionend", onEnd);
      }

      function wireAccordions() {
        const items = Array.from(document.querySelectorAll(".notice"));
        items.forEach((item) => {
          const btn = item.querySelector(".notice_head");
          const panel = item.querySelector(".notice_panel");
          if (!btn || !panel) return;

          btn.addEventListener("click", () => {
            const isOpen = item.getAttribute("aria-expanded") === "true";
            closeAll(item.getAttribute("data-id"));
            if (isOpen) {
              setExpanded(item, false);
              return;
            }
            if (panel.style.height === "auto") panel.style.height = panel.scrollHeight + "px";
            setExpanded(item, true);
          });

          btn.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
              setExpanded(item, false);
              btn.blur();
            }
          });
        });
      }

      function wireCopyButtons() {
        const btns = Array.from(document.querySelectorAll("[data-copy]"));
        btns.forEach((b) => {
          b.addEventListener("click", async () => {
            const url = b.getAttribute("data-copy") || "";
            try {
              await navigator.clipboard.writeText(url);
              const prev = b.textContent;
              b.textContent = "복사됨";
              setTimeout(() => (b.textContent = prev), 900);
            } catch {
              const prev = b.textContent;
              b.textContent = "복사 실패";
              setTimeout(() => (b.textContent = prev), 900);
            }
          });
        });
      }

      $chips.forEach((chip) => {
        chip.addEventListener("click", () => {
          $chips.forEach((c) => c.setAttribute("aria-pressed", "false"));
          chip.setAttribute("aria-pressed", "true");
          activeFilter = chip.getAttribute("data-filter") || "all";
          closeAll();
          render();
        });
      });

      $q.addEventListener("input", () => {
        closeAll();
        render();
      });

      [
        "images/cocacola_login_logo_hover.png",
        "images/customer_btn_hover.png"
      ].forEach((src) => {
        const img = new Image();
        img.src = src;
      });

      render();
    </script>
  </body>
</html>
