<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코카콜라 고객 안내</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="고객안내 | 코카콜라 - Pure Joy">
    <meta property="og:description" content="고객 안내 정보를 정리한 Customer 페이지입니다.">
    <meta property="og:url" content="https://tkdcjdyd8382.dothome.co.kr/customer.html">
    <meta property="og:image" content="https://tkdcjdyd8382.dothome.co.kr/images/og_customer.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="고객안내 | 코카콜라 - Pure Joy">
    <meta name="twitter:description" content="고객 안내 정보를 정리한 Customer 페이지입니다.">
    <meta name="twitter:image" content="https://tkdcjdyd8382.dothome.co.kr/images/og_customer.png">

    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon_index.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon_index.png">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css"
    >
    <link rel="stylesheet" href="css/customer.css">
  </head>

  <body>
    <main class="main">
      <img src="images/login_bg.png" alt="" class="login_bg">

      <section class="info_card">
        <h1 class="logo">
          <a href="index.html" class="logo_link">
            <img
              src="images/cocacola_login_logo.png"
              alt="코카콜라"
              class="logo_default"
            >
            <img
              src="images/cocacola_login_logo_hover.png"
              alt=""
              class="logo_hover"
              aria-hidden="true"
            >
          </a>
        </h1>

        <h2 class="title">고객 안내</h2>

        <div class="section">
          <div class="block">
            <span class="label">주소</span>
            <p class="value">
              서울시 종로구 새문안로 68 흥국생명빌딩 18층<br>
              한국 코카-콜라 (03184)
            </p>
          </div>

          <div class="block">
            <span class="label">코카-콜라 음료(주) 고객상담실</span>
            <p class="value">
              080-024-5999<br>
              (상담 시간: 월 ~ 금 09:00 ~ 17:30)
            </p>
          </div>

          <div class="block">
            <span class="label">안내</span>
            <p class="value">문의 접수는 상담 시간 내 순차 처리됩니다.</p>
            <ul class="list">
              <li>제품/성분, 구매/유통, 이벤트 관련 문의 가능</li>
              <li>개인정보/환불 등 민감 문의는 상담실로 연락 권장</li>
              <li>답변은 입력하신 이메일로 안내됩니다</li>
            </ul>
          </div>

          <div class="btn_row">
            <button
              type="button"
              class="btn btn-customer"
              onclick="location.href='contact.html'"
            >
              문의하기
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="js/customer.js"></script>
  </body>
</html>
